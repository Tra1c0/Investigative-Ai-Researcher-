name: APK

on:
  push:
    branches: ["ccr-f03ca82c-8hm3p9", "main"]
    paths:
      - "android/**"
      - "recherche/**"
      - "tests/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

env:
  # Strenge des Starttests. "0": verlangt nur, dass Python und das Paket starten; die
  # Oberflächenwerte werden gemessen und ausgegeben. "1": zusätzlich 'recherche: server ok'
  # und mindestens einer der Werte ui_dump (Überschrift im uiautomator-Dump) oder ui_js
  # (die Seite meldet 'oberflaeche bereit').
  UI_PFLICHT: "1"
  # Ob der Job 'veroeffentlichen' die APK als öffentliche Vorabversion bereitstellt.
  VEROEFFENTLICHEN: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.13 ist das Python der App, 3.10 das älteste, das der Runner anbietet und die README
        # zusagt, 3.15 das neueste: argparse hat sich zwischen den Versionen geändert, und daran
        # hängt die Befehlsprüfung der Oberfläche.
        python: ["3.10", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Dieselbe Version wie in der App; die PDF-Tests werden ohne pypdf übersprungen.
      - name: pypdf in der Version der App installieren
        if: matrix.python == '3.13'
        run: |
          ver=$(grep -oP "pypdf==\K[0-9][0-9A-Za-z.]*" android/app/build.gradle)
          if [ -z "$ver" ]; then echo "Keine pypdf-Version in android/app/build.gradle"; exit 1; fi
          echo "pypdf==$ver"
          python3 -m pip install "pypdf==$ver"
      - name: Tests
        run: python3 -m unittest discover -s tests

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy braucht auf der Build-Maschine dasselbe Python wie die App (version = "3.13").
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Keine Kopie des Python-Pakets unter android/
        run: |
          if find android -path '*/build' -prune -o -name '__init__.py' -print | grep .; then
            echo "Unter android/ liegt eine Kopie des Pakets"; exit 1
          fi
      - name: APK bauen
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease
      - name: APK bereitstellen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk recherche.apk
          ls -l recherche.apk
          sha256sum recherche.apk
      - name: APK prüfen (nicht debuggable, signiert)
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $bt"
          "$bt/aapt2" dump badging recherche.apk > badging.txt
          grep -E "^package|^sdkVersion|^targetSdkVersion|^uses-permission|application-debuggable" badging.txt || true
          if grep -q "application-debuggable" badging.txt; then
            echo "FEHLER: Die APK ist debuggable"; exit 1
          fi
          "$bt/apksigner" verify --verbose recherche.apk
          unzip -l recherche.apk | grep -E 'assets/chaquopy/(app|requirements)' || true
      - uses: actions/upload-artifact@v7
        with:
          name: recherche-apk
          path: recherche.apk
          if-no-files-found: error

  starttest:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: recherche-apk
          path: apk
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und App prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci/starttest.sh apk/recherche.apk starttest-out
      - name: Ergebnis des Starttests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starttest-ergebnis
          path: starttest-out
          if-no-files-found: warn

  veroeffentlichen:
    # Auch die Tests: Ohne sie ginge eine APK hinaus, deren Regeln ein Test als kaputt meldet.
    needs: [tests, apk, starttest]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/ccr-f03ca82c-8hm3p9' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: apk-vorab
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Eine öffentliche Vorabversion gibt es nur, wenn VEROEFFENTLICHEN "1" ist, also erst mit
      # geprüfter Oberfläche.
      # Der env-Kontext gilt nicht in 'if' auf Job-Ebene, deshalb der Umweg über einen Output.
      - name: Veröffentlichung verlangt?
        id: ui
        run: |
          echo "pflicht=$VEROEFFENTLICHEN" >> "$GITHUB_OUTPUT"
          if [ "$VEROEFFENTLICHEN" != "1" ]; then
            echo "Vorabversion wird erst mit geprüfter Oberfläche veröffentlicht."
          fi
      - uses: actions/download-artifact@v8
        if: steps.ui.outputs.pflicht == '1'
        with:
          name: recherche-apk
          path: apk
      - name: Release ersetzen
        if: steps.ui.outputs.pflicht == '1'
        run: |
          sha=$(sha256sum apk/recherche.apk | cut -d' ' -f1)
          {
            echo "Commit: ${GITHUB_SHA::7}"
            echo "Gebaut am: $(date -u +%Y-%m-%d)"
            echo "SHA-256: $sha"
            echo
            echo "Testbuild zum direkten Installieren. Enthält keine Falldaten und keine KI; die Agenten laufen in Claude Code."
            echo "Mit dem Debug-Schlüssel des Build-Rechners signiert, der bei jedem Lauf neu entsteht: Eine neuere Version lässt sich nicht über diese installieren. Erst deinstallieren, vorher die Fälle exportieren."
          } > notes.md
          cat notes.md
          gh release delete apk-vorab --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || echo "Kein altes Release vorhanden"
          gh release create apk-vorab apk/recherche.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Recherche-App (Vorabversion)" \
            --prerelease \
            --notes-file notes.md
          gh release view apk-vorab --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease,targetCommitish \
            --jq '"prerelease=\(.isPrerelease) ziel=\(.targetCommitish) assets=\([.assets[] | "\(.name) \(.size) \(.digest)"] | join(","))"'
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-vorab/recherche.apk"
